<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="@@CSP@@">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Modernization report</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--surface:#fff;--text:#1a1f27;--muted:#4a5565;--line:#d3d8e0;--link:#0a57b8;--focus:#0a57b8;--code:#eceff4;--hit:#ffe58a;--hit-text:#1a1f27;--paper:#fff;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1217;--surface:#161b22;--text:#e6e9ee;--muted:#a9b2bf;--line:#2c3541;--link:#7db4ff;--focus:#9cc4ff;--code:#1f262f;--hit:#7a5c00;--hit-text:#fff;
--ok-bg:#12321f;--ok:#a7e8bd;--bad-bg:#3d1417;--bad:#ffc4c4;--warn-bg:#3a2d0a;--warn:#f6d58a;--info-bg:#15294a;--info:#b9d3ff;--flat-bg:#232b36;--flat:#d5dbe4}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1217;--surface:#161b22;--text:#e6e9ee;--muted:#a9b2bf;--line:#2c3541;--link:#7db4ff;--focus:#9cc4ff;--code:#1f262f;--hit:#7a5c00;--hit-text:#fff;
--ok-bg:#12321f;--ok:#a7e8bd;--bad-bg:#3d1417;--bad:#ffc4c4;--warn-bg:#3a2d0a;--warn:#f6d58a;--info-bg:#15294a;--info:#b9d3ff;--flat-bg:#232b36;--flat:#d5dbe4}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);padding:8px 12px;border-radius:6px;z-index:10}.skip:focus{top:8px}
a{color:var(--link)}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
h1{font-size:1.3rem;line-height:1.25;margin:0}#sub{margin:2px 0 0;font-size:.875rem}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 260px;justify-content:flex-end}
input,button,select{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:8px;background:var(--surface)}
input{flex:1 1 180px;max-width:380px;min-width:0;padding:8px 10px;background:var(--bg)}button,select{padding:7px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--info-bg);color:var(--info);border-color:var(--info)}
main{padding-top:20px;padding-bottom:64px}
h2{font-size:1.25rem;margin:0 0 12px}h3{font-size:1.05rem;margin:22px 0 8px}
.glance{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:20px}.glance h2{font-size:1rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.banner{border-radius:8px;padding:10px 14px;margin:0 0 12px;font-weight:600}.banner p{margin:4px 0 0;font-weight:400}
.ok{background:var(--ok-bg);color:var(--ok)}.bad{background:var(--bad-bg);color:var(--bad)}.warn{background:var(--warn-bg);color:var(--warn)}.info{background:var(--info-bg);color:var(--info)}.flat{background:var(--flat-bg);color:var(--flat)}
.chips,.sec .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.chip,.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8125rem;line-height:1.5;font-weight:600;background:var(--flat-bg);color:var(--flat)}
.chip.ok,.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:400;border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}.stat dt{font-size:.8125rem;color:var(--muted)}.stat dd{margin:2px 0 0;font-weight:600}.stat small{display:block;font-weight:400;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
#nav{position:sticky;top:12px}#nav ul{list-style:none;margin:0;padding:0}#navsel{display:none;width:100%}
#nav li a{display:block;padding:7px 12px;border-radius:8px;color:var(--text);text-decoration:none}#nav li a:hover{background:var(--flat-bg)}#nav li a[aria-current=true]{background:var(--info-bg);color:var(--info);font-weight:600}
#found{font-size:.8125rem;margin:8px 12px}
#content{min-width:0}.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.docname{font:600 .8125rem ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);margin:24px 0 0;border-top:1px solid var(--line);padding-top:12px}.sec h2+.docname{margin-top:0;border:0;padding:0}
.sec p,.sec li{max-width:80ch}.sec ul,.sec ol{padding-left:1.4em}.sec h3,.sec h4,.sec h5,.sec h6{line-height:1.3}.sec h4{font-size:1rem}.sec h5,.sec h6{font-size:.9375rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875em;background:var(--code);padding:1px 5px;border-radius:4px}
pre{background:var(--code);border-radius:8px;padding:12px;overflow:auto;max-width:100%;margin:12px 0;font-size:.8125rem;line-height:1.5;overflow-wrap:normal}pre code{background:none;padding:0;font-size:inherit}
blockquote{margin:12px 0;padding:2px 14px;border-left:4px solid var(--line);color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.tw{overflow:auto;max-width:100%;margin:12px 0;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{background:var(--code);white-space:nowrap}tr:last-child td{border-bottom:0}.r{text-align:right}.c{text-align:center}.nw{white-space:nowrap}
.task{font-family:system-ui,sans-serif}mark.hit{background:var(--hit);color:var(--hit-text);border-radius:2px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--bg)}.card h4{margin:0 0 6px;font-size:1rem}.card .rid{font:600 .8125rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);display:block}
.cbody pre{white-space:pre-wrap;overflow-wrap:anywhere}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.cbody p{margin:6px 0}.badge[data-p=P0]{background:var(--bad-bg);color:var(--bad)}.badge[data-p=P1]{background:var(--warn-bg);color:var(--warn)}
.tool{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
figure{margin:16px 0}figcaption{font:.8125rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:6px}.mm{--text:#1a1f27;--muted:#4a5565;--code:#eceff4;--link:#0a57b8;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;text-align:center;min-height:48px}.mm svg{max-width:100%;height:auto}
.mm .note,.note{color:var(--muted);text-align:left;margin:0 0 8px}.mm pre{text-align:left}
details{margin:6px 0}summary{cursor:pointer;color:var(--link)}.diff{background:var(--bad-bg);color:var(--bad);font-weight:700}.hash{font:.75rem ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
@media (max-width:860px){.layout{display:block}#nav{position:static;margin-bottom:12px}#navlist{display:none}#navsel{display:block}#found{margin:6px 0 0}.sec{padding:14px}.tools{justify-content:stretch}input{max-width:none}}
@media print{:root{color-scheme:light;--bg:#fff;--surface:#fff;--text:#000;--muted:#333;--line:#999;--link:#000;--code:#f0f0f0}.top,#nav,.tools,.tool{display:none}.sec[hidden]{display:block!important}.sec,.glance{border:0;padding:0;break-inside:auto}.card,figure,tr{break-inside:avoid}body{font-size:11pt}.layout{display:block}}
.next{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px}.next .chip{font-size:.875rem;user-select:all}.next .why{color:var(--muted);font-size:.875rem}.copy{font:inherit;font-size:.8125rem;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px;padding:2px 10px;cursor:pointer}.copy:hover{border-color:var(--link)}@media print{.copy{display:none}}
/* keep short words and pills whole in table cells (long paths still break inside code) */
td,th{overflow-wrap:break-word}td code,td .hash{overflow-wrap:anywhere}.badge,.chip{white-space:nowrap}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to the report</a>
<header class="top"><div class="wrap bar">
<div><h1 id="ttl">Modernization report</h1><p id="sub" class="muted"></p></div>
<div class="tools"><label class="sr" for="q">Search the report</label><input id="q" type="search" placeholder="Search the report" autocomplete="off"><button id="theme" type="button"></button></div>
</div></header>
<main class="wrap">
<section id="glance" class="glance" aria-labelledby="glance-h"></section>
<div class="layout">
<nav id="nav" aria-label="Report sections"><label class="sr" for="navsel">Section</label><select id="navsel"></select><ul id="navlist"></ul><p id="found" class="muted" role="status" aria-live="polite"></p></nav>
<div id="content" tabindex="-1"></div>
</div>
</main>
<noscript><p class="wrap">This report needs JavaScript. Nothing is fetched from the network; all of its data is inside this file.</p></noscript>
<script type="application/json" id="report-data">@@DATA@@</script>

  sec.el = el;
  drawQueue(mmQueue.splice(0));
  return el;
}

/* ---- diagrams: Mermaid in strict mode; anything that fails shows its source */
var mmSeq = 0, mmReady = false, mmChain = Promise.resolve();
function drawQueue(items) { items.forEach(function (it) { mmChain = mmChain.then(function () { return draw(it); }); }); }
function fail(it, src, e) {
  var host = it.el, msg = String((e && e.message) || e || 'unknown error').split('\n')[0].slice(0, 160);
  host.textContent = '';
  host.appendChild(h('p', {class: 'note'}, ['This diagram could not be drawn (' + msg + '). Its source is shown instead.']));
  host.appendChild(h('pre', {tabindex: '0'}, [h('code', null, [src])]));
  if (it.tool) it.tool.hidden = true;
}
async function draw(it) {
  var id = 'mm' + (++mmSeq), src = it.src;
  try {
    if (src.length > 100000) throw new Error('the source is larger than 100,000 characters');
    src = src.replace(/%%\{[\s\S]*?\}%%/g, '');
    if (typeof mermaid === 'undefined') throw new Error('the Mermaid library is not included in this file');
    if (!mmReady) { mermaid.initialize({startOnLoad: false, securityLevel: 'strict', theme: 'default', maxTextSize: 100000, fontFamily: 'system-ui, sans-serif'}); mmReady = true; }
    await mermaid.parse(src);
    /* Mermaid's output is HTML-flavoured SVG (not always valid XML), already sanitised by strict mode; parse it into an inert document, scrub it, then adopt it */
    var out = await mermaid.render(id, src), svg = new DOMParser().parseFromString('<!doctype html><body>' + out.svg, 'text/html').body.querySelector('svg');
    if (!svg) throw new Error('the drawing could not be read back');
    Array.prototype.forEach.call(svg.querySelectorAll('*'), function (n) {
      if (/^(script|iframe|object|embed|link|meta|base|img|image|video|audio|source|track|picture|form|input|button|textarea|select)$/i.test(n.nodeName)) { n.parentNode.removeChild(n); return; }
      if (/^style$/i.test(n.nodeName)) n.textContent = n.textContent.replace(/@import[^;]*;?/gi, '').replace(/url\(\s*['"]?\s*(?!#)[^)]*\)/gi, 'none');
      Array.prototype.slice.call(n.attributes).forEach(function (a) {
        if (/^on/i.test(a.name) || /^(src|srcset|action|formaction|poster)$/i.test(a.name) || (/href$/i.test(a.name) && a.value.charAt(0) !== '#') ||
          (a.name === 'style' && /url\(\s*['"]?\s*[^#'"\s)]/i.test(a.value))) n.removeAttribute(a.name);
      });
    });
    var vb = (svg.getAttribute('viewBox') || '').split(/[ ,]+/);
    svg.setAttribute('data-w', vb[2] || '');
    svg.removeAttribute('height');
    it.el.textContent = '';
    it.el.appendChild(document.importNode(svg, true));
  } catch (e) {
    [id, 'd' + id].forEach(function (x) { var n = $(x); if (n && n.parentNode) n.parentNode.removeChild(n); });
    fail(it, src, e);
  }
}

/* ---- navigation, search, theme */
function textOf(sec) {
  var t = [sec.title];
  sec.parts.forEach(function (p) {
    (p.blocks || []).forEach(function (b) { t.push(b.k === 'rule' ? [b.id, b.title, b.cat, b.cites.join(' '), b.body].join(' ') : b.text); });
    (p.items || []).forEach(function (i) { t.push(typeof i === 'string' ? i : Array.isArray(i) ? i.join(' ') : i.name + ' ' + i.src); });
    (p.rows || []).forEach(function (r) { t.push(r.join(' ')); });
    if (p.proof) { t.push(p.proof.headline); p.proof.modules.forEach(function (m) { t.push([m.name, m.verdict, m.reasons.join(' '), m.passed.join(' '), m.p0.map(function (r) { return r.id + ' ' + r.name; }).join(' '), m.notProven.join(' '), m.people.map(function (i) { return i.text; }).join(' ')].join(' ')); }); }
    if (p.eq) { t.push(p.eq.headline); p.eq.cases.forEach(function (c) { t.push([c.id, c.title, c.reason, c.approvedDifference, c.note].join(' ')); }); }
    t.push(p.text || '', p.name || '', p.title || '');
  });
  return t.join('\n').toLowerCase();
}
function clearMarks(root) { Array.prototype.forEach.call(root.querySelectorAll('mark.hit'), function (m) { m.parentNode.replaceChild(document.createTextNode(m.textContent), m); }); root.normalize(); }
function highlight(root) {
  clearMarks(root);
  if (!term) return 0;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: function (n) { return n.parentNode.closest('svg,script,style,mark') ? NodeFilter.FILTER_REJECT : n.nodeValue.toLowerCase().indexOf(term) >= 0 ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP; }}), nodes = [], n, count = 0;
  while ((n = w.nextNode()) && nodes.length < 400) nodes.push(n);
  nodes.forEach(function (node) {
    var text = node.nodeValue, low = text.toLowerCase(), pos = 0, at, frag = document.createDocumentFragment();
    while ((at = low.indexOf(term, pos)) >= 0) { frag.appendChild(document.createTextNode(text.slice(pos, at))); frag.appendChild(h('mark', {class: 'hit'}, [text.slice(at, at + term.length)])); pos = at + term.length; count++; }
    frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
  return count;
}
function show(id) {
  var sec = byId[id] || secs[0];
  if (!sec) return;
  active = sec;
  secs.forEach(function (s) { if (s.el) s.el.hidden = s !== sec; });
  ensure(sec).hidden = false;
  Array.prototype.forEach.call($('navlist').querySelectorAll('a'), function (a) { a.setAttribute('aria-current', a.getAttribute('data-id') === sec.id ? 'true' : 'false'); });
  $('navsel').value = sec.id;
  var r = highlight(sec.el), first = sec.el.querySelector('mark.hit');
  $('found').textContent = term ? (r ? r + ' matches in this section' : 'No matches in this section') + '; ' + secs.filter(function (s) { return !s.gone; }).length + ' sections match' : '';
  if (first) first.scrollIntoView({block: 'center'}); else if ($('content').getBoundingClientRect().top < 0) $('content').scrollIntoView();
}
function jump(id) {
  var t = $(id), s;
  if (!t) secs.some(function (x) { ensure(x); t = $(id); return t; });
  if (!t) return;
  s = secs.filter(function (x) { return x.el && x.el.contains(t); })[0];
  if (s && s !== active) show(s.id);
  t.scrollIntoView({block: 'start'});
}
function route() {
  var hash = '';
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) { hash = ''; }
  if (hash.indexOf('sec-') === 0 && byId[hash.slice(4)]) show(hash.slice(4));
  else if (hash) { if (!active) show(secs[0].id); jump(hash); }
  else show(secs[0] && secs[0].id);
}
function search() {
  term = $('q').value.trim().toLowerCase();
  if (term.length < 2) term = '';
  secs.forEach(function (s) {
    s.gone = !!term && (s.text = s.text || textOf(s)).indexOf(term) < 0;
    s.li.hidden = s.gone; s.opt.hidden = s.opt.disabled = s.gone;
  });
  var live = secs.filter(function (s) { return !s.gone; });
  if (term && !live.length) { $('found').textContent = 'No section contains “' + term + '”.'; return; }
  show(active && !active.gone ? active.id : (live[0] || secs[0]).id);
}
function setTheme(v) {
  if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  $('theme').textContent = 'Theme: ' + (v === 'light' || v === 'dark' ? v : 'auto');
  try { localStorage.setItem('report-theme', v || 'auto'); } catch (e) { /* storage can be blocked */ }
}

function start() {
  try { D = JSON.parse($('report-data').textContent); } catch (e) { $('content').textContent = 'The report data in this file could not be read.'; return; }
  document.title = 'Modernization report: ' + D.system;
  $('ttl').textContent = 'Modernization report: ' + D.system;
  $('sub').textContent = 'Built from the files in analysis/' + D.system + '/ on ' + D.generated + '. Nothing here is loaded from the network.';
  secs = D.sections || [];
  secs.forEach(function (s) {
    byId[s.id] = s;
    s.li = h('li', null, [h('a', {href: '#sec-' + s.id, 'data-id': s.id}, [s.title])]);
    s.opt = h('option', {value: s.id}, [s.title]);
    $('navlist').appendChild(s.li); $('navsel').appendChild(s.opt);
  });
  renderGlance();
  $('navsel').addEventListener('change', function () { location.hash = '#sec-' + this.value; });
  var timer;
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(search, 150); });
  $('content').addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (a && a.getAttribute('href').length > 1) { e.preventDefault(); jump(decodeURIComponent(a.getAttribute('href').slice(1))); }
  });
  $('glance').addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('a[href^="#sec-"]'); if (a) { e.preventDefault(); show(a.getAttribute('href').slice(5)); } });
  var saved = 'auto';
  try { saved = localStorage.getItem('report-theme') || 'auto'; } catch (e) { /* ignore */ }
  setTheme(saved);
  $('theme').addEventListener('click', function () { var cur = document.documentElement.getAttribute('data-theme'); setTheme(cur === 'light' ? 'dark' : cur === 'dark' ? 'auto' : 'light'); });
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeprint', function () { secs.forEach(ensure); Array.prototype.forEach.call(document.querySelectorAll('details'), function (d) { d.open = true; }); });
  route();
}
start();
})();
</script>
