name: security-guidance timing check
on:
  push:
    branches: [mhegazy/sg2020modelarm]
permissions:
  contents: read
jobs:
  timing:
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { path: this }
      - uses: actions/checkout@v4
        with: { ref: main, path: base }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest
      - name: Alternate the two trees
        shell: python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          import re, subprocess, sys
          T = "tests/test_inflight_reviews.py::test_a_push_that_waited_ends_within_the_hook_limit"
          def run(tree, target):
              r = subprocess.run([sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider", target],
                                 cwd=tree + "/plugins/security-guidance", capture_output=True, text=True, errors="replace")
              return r.returncode, r.stdout
          counts = {"this": [0, 0], "base": [0, 0]}
          fails = []
          for i in range(40):
              for t in ("this", "base"):
                  rc, out = run(t, T)
                  counts[t][0 if rc == 0 else 1] += 1
                  if rc:
                      fails.append(t + ": " + " ".join(re.findall(r"^E +assert.*$", out, re.M)[:1]))
          print("::notice title=single test alone::this %d passed %d failed; main %d passed %d failed" % (*counts["this"], *counts["base"]), flush=True)
          print("::notice title=failures::" + (" / ".join(fails)[:3000] or "none"), flush=True)
          for t in ("this", "base", "this", "base"):
              rc, out = run(t, "tests/test_inflight_reviews.py")
              print("::notice title=whole file %s::%s" % (t, out.strip().splitlines()[-1]), flush=True)
