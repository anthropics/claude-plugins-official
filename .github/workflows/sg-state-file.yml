name: security-guidance state file tests
on:
  push:
    branches:
      - mhegazy/sg-platform-tests
permissions:
  contents: read
jobs:
  t:
    name: ${{ matrix.ref }} on ${{ matrix.os }}
    if: ${{ contains(github.event.head_commit.message, '[store-cert]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        ref: [main, 'refs/pull/7028/head']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: plugins/security-guidance
        run: |
          python -m pip install -q pytest
          for i in 1 2 3; do
            python -m pytest -q -p no:cacheprovider tests/test_repo_resolution.py -rA --tb=short \
              -k "hint_saved or ups_uses_hint or subagent_stop or main_edits or sha_scan" > out.txt 2>&1 || true
            msg=$(grep -E '^(PASSED|FAILED|E  )' out.txt | cut -c1-330 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
            echo "::notice title=state-file run $i::$msg"
          done
