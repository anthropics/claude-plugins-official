country_code: "US"

bindings:
  - capability_id: case-law-search
    tier: free
    mcp_server:
      name: "CourtListener"
      url: "https://mcp.courtlistener.com/"
      transport: http
    auth_type: api_key
    coverage_notes: "Federal içtihat, PACER dosyaları, yargıç profilleri, sözlü savunmalar, atıf doğrulama. API anahtarı opsiyonel (public erişim de var)."
    degrades_gracefully: true

  - capability_id: case-law-search
    tier: paid
    mcp_server:
      name: "Trellis"
      url: "https://mcp.trellis.law/anthropic"
      transport: http
    auth_type: oauth
    coverage_notes: "ABD'nin en büyük eyalet ilk derece mahkemesi veri seti — dosyalar, kararlar, hakim/karşı avukat analitiği."
    degrades_gracefully: true

  - capability_id: regulatory-feed
    tier: free
    mcp_server:
      name: "Federal Register API"
      url: "https://www.federalregister.gov/api/v1/documents"
      transport: http
    auth_type: none
    coverage_notes: "Tüm federal kural, önerilen kural, bildirim ve başkanlık belgeleri. Yorum süresi ve yürürlük tarihini yapılandırılmış döner."
    degrades_gracefully: true

  - capability_id: e-signature
    tier: paid
    mcp_server:
      name: "DocuSign"
      url: "https://mcp.docusign.com/mcp"
      transport: http
    auth_type: oauth
    coverage_notes: "Zarf/imza durumu, envelope arama. employment-legal'de fesih mektubu/anlaşma imza takibi için kullanılır."
    degrades_gracefully: true

  - capability_id: document-management
    tier: paid
    mcp_server:
      name: "iManage"
      url: "https://cloudimanage.com/mcp/work"
      transport: http
    auth_type: oauth
    coverage_notes: "DMS meta verisi — izinlere bağlı, denetlenebilir."
    degrades_gracefully: true
